name: repository-hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-current-release:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current release with Windows PowerShell
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          python scripts/check_governance.py --all --working-tree --require-clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify current release with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          python scripts/check_governance.py --all --working-tree --require-clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: astral-sh/setup-uv@v6
        if: matrix.shell == 'pwsh'
        with:
          version: '0.12.22'
      - name: Prepare pinned governance runtime
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          ./scripts/prepare_governance.ps1
          & .cache/aios-source/.venv/Scripts/codex-os.exe check . --change-class small_change --requirement-id REQ-YOLO-002 --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native-architectures:
    # Release presets use Visual Studio 17 2022; windows-latest now has VS2026.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        profile: [ci-x86, ci-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified ONNX Runtime and DirectML SDK
        shell: pwsh
        run: |
          ./scripts/prepare_dependencies.ps1 -OpenCVArchitecture None -PythonExe python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native API and tests
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.profile }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset ${{ matrix.profile }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and pair the x64 Worker for the x86 proxy
        if: matrix.profile == 'ci-x86'
        shell: pwsh
        run: |
          cmake --preset ci-worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset ci-worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath build/ci-worker/Release/CQ_AI_worker.exe -Destination build/ci-x86/Release/CQ_AI_worker.exe
      - name: Test real CPU YOLO transport and OCR logic
        shell: pwsh
        run: |
          ctest --test-dir build/${{ matrix.profile }} -C Release --output-on-failure -R 'ai_engine_(yolo_model|yolo_pipeline|yolo_transport|ocr_color_filter|ocr_reading_order)_test'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  masked-cv-regression:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned static OpenCV
        shell: pwsh
        run: |
          ./scripts/prepare_dependencies.ps1 -OpenCVArchitecture ${{ matrix.arch }} -SkipRuntime -PythonExe python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build synthetic transparent-mask regressions
        shell: pwsh
        run: |
          $platform = if ('${{ matrix.arch }}' -eq 'x86') { 'Win32' } else { 'x64' }
          $x64Dll = if ('${{ matrix.arch }}' -eq 'x64') { 'ON' } else { 'OFF' }
          cmake -S . -B build/ci-masked-${{ matrix.arch }} -G 'Visual Studio 17 2022' -A $platform -DAIENGINE_WITH_OPENCV=ON -DAIENGINE_OPENCV_DIR="${{ github.workspace }}/third_party/opencv-5.0.0-static-mt/${{ matrix.arch }}" -DAIENGINE_WITH_ONNXRUNTIME=OFF -DAIENGINE_BUILD_X64_DLL=$x64Dll -DAIENGINE_BUILD_WORKER=OFF -DAIENGINE_BUILD_TESTS=ON -DAIENGINE_CV_TEST_HOOKS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/ci-masked-${{ matrix.arch }} --config Release --target ai_engine_cv_masked_correlation_test ai_engine_cv_transparent_completeness_test ai_engine_cv_correlation_test ai_engine_cv_masked_score_test ai_engine_cv_stability_test --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/ci-masked-${{ matrix.arch }} -C Release --output-on-failure -R '^ai_engine_cv_(masked_correlation|transparent_completeness|correlation|masked_score|stability)_test$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
