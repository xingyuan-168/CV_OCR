name: repository-hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-current-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v23.5 release, documentation and repository layout
        shell: pwsh
        run: ./scripts/check_repository_hygiene.ps1 -CheckWorkingTree -RequireClean
