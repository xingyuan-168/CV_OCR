# 生产环境 ONNX Runtime 配置模板。
# 将本文件复制为 configs/onnxruntime.local.ini，并填写绝对路径或相对应用目录的路径。

runtime.thread_count=1
runtime.prefer_gpu=false
# 0=AUTO（DirectML失败后回退CPU），1=DirectML，2=CPU
runtime.device=0
runtime.device_id=0

yolo.backend=onnxruntime
yolo.model_path=models/yolo/best.onnx
yolo.labels_path=
yolo.input_width=640
yolo.input_height=640
yolo.conf_threshold=0.25
yolo.nms_threshold=0.45

ocr.backend=onnxruntime
ocr.det_model_path=models/ocr_ppocrv6/det.fp32.onnx
ocr.rec_model_path=models/ocr_ppocrv6/rec.fp32.onnx
ocr.charset_path=models/ocr_ppocrv6/ppocrv6_tiny_dict.txt
# true = 纯识别模式，将整张输入图/ROI 视为一行文本。
# false = 先运行检测，再对检测到的文本框执行识别。
ocr.rec_only=false
ocr.input_height=48
ocr.input_width=320
ocr.version=pp-ocrv6-tiny
