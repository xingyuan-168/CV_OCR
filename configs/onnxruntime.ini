# ONNX Runtime 后端配置。模型路径可以先留空，用于验证 DLL 能创建后端。

runtime.thread_count=1
runtime.prefer_gpu=false
# 0=AUTO（DirectML失败后回退CPU），1=DirectML，2=CPU
runtime.device=0
runtime.device_id=0

yolo.backend=onnxruntime
yolo.model_path=
yolo.labels_path=
yolo.input_width=640
yolo.input_height=640
yolo.conf_threshold=0.25
yolo.nms_threshold=0.45

ocr.backend=onnxruntime
ocr.det_model_path=
ocr.rec_model_path=
ocr.charset_path=
ocr.rec_only=true
ocr.input_height=48
ocr.input_width=320
ocr.version=pp-ocrv6-tiny
