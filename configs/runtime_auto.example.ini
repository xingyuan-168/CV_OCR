# 业务运行时模板。所有路径、尺寸、阈值和并发数量由部署方按业务场景填写。
# 0=AUTO（DirectML失败后回退CPU），1=DirectML，2=CPU。
runtime.device=2
runtime.device_id=0
runtime.thread_count=1

# ONNX Runtime 后端与业务模型。
yolo.backend=onnxruntime
yolo.model_path=models/yolo/best.onnx
yolo.labels_path=
yolo.input_width=320
yolo.input_height=320
yolo.conf_threshold=0.25
yolo.nms_threshold=0.45

ocr.backend=onnxruntime
ocr.det_model_path=
ocr.rec_model_path=models/ocr_ppocrv6/rec.fp32.onnx
ocr.charset_path=models/ocr_ppocrv6/ppocrv6_tiny_dict.txt
ocr.rec_only=true
ocr.input_height=48
ocr.input_width=320
ocr.channel_order=bgr
