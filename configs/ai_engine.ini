# 默认不启用真实模型后端，便于先验证 DLL ABI 和易语言调用。
# 添加对应后端后，可以把 backend 改成 tensorrt/openvino/onnxruntime。

runtime.thread_count=1
runtime.prefer_gpu=true
# runtime.device: 0=AUTO（DirectML失败后回退CPU），1=DirectML，2=CPU
runtime.device=2
runtime.device_id=0

yolo.backend=null
yolo.model_path=
yolo.input_width=320
yolo.input_height=320
yolo.conf_threshold=0.25
yolo.nms_threshold=0.45

ocr.backend=null
ocr.det_model_path=
ocr.rec_model_path=
ocr.charset_path=
ocr.rec_only=true
ocr.input_height=32
ocr.input_width=160
ocr.mock_text=MOCK
