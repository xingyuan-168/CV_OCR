# PP-OCRv6 tiny 推荐配置。正式交付优先调用 OCR_LoadEmbeddedModel，
# 本文件用于 x64 标准 API 或外部模型替换场景。
runtime.thread_count=0
runtime.intra_op_threads=0
runtime.inter_op_threads=1
runtime.session_count=1
runtime.prefer_gpu=true
runtime.device=2
runtime.device_id=0

yolo.backend=null

ocr.backend=onnxruntime
ocr.det_model_path=models/ocr_ppocrv6/det.fp32.onnx
ocr.rec_model_path=models/ocr_ppocrv6/rec.fp32.onnx
ocr.charset_path=models/ocr_ppocrv6/ppocrv6_tiny_dict.txt
ocr.rec_only=false
ocr.input_height=48
ocr.input_width=320
ocr.version=pp-ocrv6-tiny
ocr.channel_order=bgr
ocr.det_input_width=0
ocr.det_input_height=0
ocr.det_binary_threshold=0.3
ocr.det_box_score_threshold=0.0
ocr.det_unclip_ratio=1.0
ocr.det_min_area=50
ocr.decoder=greedy
ocr.beam_width=5
